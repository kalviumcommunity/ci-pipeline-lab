name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/ci-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FIX 1: Authenticate to Docker Hub using repository secrets before pushing
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FIX 2: Namespace the image to the Docker Hub user and tag with immutable commit SHA
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

  # FIX 3: Deploy job sequence - wait for build to succeed using `needs: build`
  deploy:
    name: Deploy to Local Runtime
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy with Docker Compose
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
          sleep 5
          curl -i http://localhost:8080/health
          curl -f http://localhost:8080/health
